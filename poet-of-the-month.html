<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Poet of the Month at Saiidi Poetry." />
    <title>Poet of the Month | Saiidi Poetry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Italianno&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="spotlight-page">
    <main class="spotlight">
      <section class="spotlight-hero" aria-labelledby="poet-name">
        <a class="spotlight-return" href="poets-corner.html">← <span>POET’S CORNER</span></a>
        <p class="spotlight-title">POET OF THE MONTH</p>
        <svg class="spotlight-bloom bloom-top-left" viewBox="0 0 100 100" aria-hidden="true"><g><ellipse cx="50" cy="27" rx="14" ry="29" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(72 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(144 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(216 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(288 50 50)" /></g></svg>
        <svg class="spotlight-bloom bloom-top-right" viewBox="0 0 100 100" aria-hidden="true"><g><ellipse cx="50" cy="27" rx="14" ry="29" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(72 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(144 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(216 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(288 50 50)" /></g></svg>
        <svg class="spotlight-bloom bloom-bottom" viewBox="0 0 100 100" aria-hidden="true"><g><ellipse cx="50" cy="27" rx="14" ry="29" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(72 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(144 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(216 50 50)" /><ellipse cx="50" cy="27" rx="14" ry="29" transform="rotate(288 50 50)" /></g></svg>
        <button class="spotlight-card" type="button" aria-pressed="false" aria-label="Turn the Poet of the Month card">
          <span class="spotlight-card-inner">
            <span class="spotlight-card-face spotlight-card-front">
              <span class="card-face-label">AUGUST 2026</span>
              <span class="card-poem">I kept a small light<br />in my pocket<br />for the days<br />the sky forgot itself.</span>
              <span class="card-turn">TURN THE CARD ↗</span>
            </span>
            <span class="spotlight-card-face spotlight-card-back">
              <span class="card-face-label">AUGUST 2026</span>
              <!-- Replace Moonwater and this note with the selected poet's pen name and words. -->
              <span class="card-poet" id="poet-name">Moonwater</span>
              <span class="card-note">“This poem started on a day I needed to remember that a little light can still be enough.”</span>
              <span class="card-turn">TURN BACK ↗</span>
            </span>
          </span>
        </button>
      </section>

    </main>
    <script>
      const card = document.querySelector('.spotlight-card');
      card.addEventListener('click', () => {
        const flipped = card.classList.toggle('is-flipped');
        card.setAttribute('aria-pressed', String(flipped));
      });
    </script>
  </body>
</html>
